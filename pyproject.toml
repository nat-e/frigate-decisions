[project]
name = "frigate-decisions"
version = "0.1.0"
description = "Ask your Frigate cameras yes/no questions with a decision model, and turn the answers into Frigate events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.5,<0.8",
    "pillow>=11",
    "pyyaml>=6",
    "requests>=2.32",
]

[project.scripts]
frigate-decisions = "frigate_decisions.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
