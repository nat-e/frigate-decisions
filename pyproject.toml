[project]
name = "frigate-decisions"
version = "0.1.1"
description = "Ask your Frigate cameras yes/no questions with a decision model, and turn the answers into Frigate events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.5,<0.8",
    "pillow>=11",
    "pyyaml>=6",
    "requests>=2.32",
    "opentelemetry-api>=1.45,<2",
    "openai>=3.46.0,<4",
]

[project.scripts]
frigate-decisions = "frigate_decisions.__main__:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-distro>=0.66b0,<1",
    "opentelemetry-exporter-otlp>=1.45,<2",
    "opentelemetry-instrumentation-logging>=0.66b0,<1",
    "opentelemetry-instrumentation-requests>=0.66b0,<1",
    "opentelemetry-instrumentation-system-metrics>=0.66b0,<1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "opentelemetry-sdk>=1.45,<2",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "B",   # likely bugs
    "I",   # import order
    "RUF", # ruff's own rules
    "SIM", # simpler code
    "UP",  # newer Python syntax
]

[tool.basedpyright]
include = ["src", "tests"]
executionEnvironments = [
    # Test fakes take the arguments of what they replace, without using them all
    { root = "tests", reportUnusedParameter = false },
]
